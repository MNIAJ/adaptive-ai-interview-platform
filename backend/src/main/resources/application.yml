server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/interview_platform
    username: postgres
    password: ayush1923
  jpa:
    hibernate:
      ddl-auto: update   # fine for a student project; use Flyway/Liquibase migrations for anything real
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}     # only needed if app.ai.provider=springai
      chat:
        options:
          model: gpt-4o-mini

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-dev-only-secret-change-me-before-any-real-deployment-32chars}
    expiration-ms: 86400000  # 24 hours
  ai:
    provider: ${AI_PROVIDER:mock}   # mock | openai | springai
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
